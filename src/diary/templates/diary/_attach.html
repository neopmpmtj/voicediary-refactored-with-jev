<div class="attach">
  <input type="file" id="{{ input_id|default:'attachInput' }}" name="files" multiple class="attach-input">
  <label for="{{ input_id|default:'attachInput' }}" id="{{ button_id|default:'attachBtn' }}" class="button attach-btn">Attach files</label>
  <span id="{{ badge_id|default:'attachBadge' }}" class="attach-badge" hidden>0</span>
  <ul id="{{ list_id|default:'attachList' }}" class="attach-list"></ul>
</div>
