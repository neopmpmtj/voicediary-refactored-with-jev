{% extends "base.html" %}
{% load i18n %}

{% block top_bar %}
<header class="sticky top-0 z-40 bg-background/80 backdrop-blur-sm border-b border-border">
  <div class="flex items-center justify-between px-4 py-3 max-w-3xl mx-auto">
    <div class="flex items-center gap-1">
      <a href="{% url 'diary:voice' %}"
         class="vd-btn vd-btn-ghost px-2 py-1.5 text-sm gap-1.5"
         aria-label="{% trans 'Back to input' %}">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
        </svg>
        <span class="hidden sm:inline">{% trans "Back" %}</span>
      </a>
    </div>
    <h1 class="text-base font-semibold text-foreground truncate">
      {% block page_title %}{% trans "Dashboard" %}{% endblock %}
    </h1>
    <div class="flex items-center gap-2">
      {% block dashboard_top_right %}
      <div class="w-16"></div>
      {% endblock %}
    </div>
  </div>
</header>
{% endblock %}

{% block content %}
<div class="flex-1 max-w-3xl w-full mx-auto px-4 py-6 overflow-x-hidden">
  {% block dashboard_content %}{% endblock %}
</div>
{% endblock %}
