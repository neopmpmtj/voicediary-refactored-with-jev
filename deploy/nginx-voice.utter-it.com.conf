# nginx vhost for the new voice diary (JEV).
# Install to /etc/nginx/sites-available/voice.utter-it.com and symlink into sites-enabled.
# Then: certbot --nginx -d voice.utter-it.com   (adds the listen/ssl lines + cert)
#
# NOTE: /media/ is deliberately NOT aliased here. Attachment and audio downloads are
# owner-only and served by the Django app; exposing them via nginx would bypass auth.

server {
    server_name voice.utter-it.com;

    client_max_body_size 550M;

    # Collected static (Tailwind CSS, JS, icons)
    location /static/ {
        alias /home/pmpmt/app/voicediary_jev/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_connect_timeout 60;
    }

    listen 80;
    listen [::]:80;
}
