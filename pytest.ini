[pytest]
DJANGO_SETTINGS_MODULE = src.config.settings.test
testpaths = src/accounts src/diary src/conference src/urls_others
norecursedirs = sample-old-version-delete-when-finished-using .venv
python_files = tests.py test_*.py *_tests.py
markers =
    unit: in-process tests with no Django test client
    integration: Django test client, management commands, or HTTP
